name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 캡처는 Actions 탭의 "Run workflow"(수동 실행)일 때만 새로 찍는다. 일반 푸시는 아래 "Keep previous shots" 로 기존 캡처를 유지.
      # 화면 캡처 → dist/shots/{화면ID}.png + index.json (실패해도 배포는 계속)
      - name: Install Playwright
        id: pw
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          sudo apt-get install -y fonts-noto-color-emoji
          npx playwright install --with-deps chromium
      - name: Capture screens
        if: github.event_name == 'workflow_dispatch' && steps.pw.outcome == 'success'
        continue-on-error: true
        working-directory: scripts
        run: node shots.mjs --dist ../dist --out ../dist/shots
      # 구역·케이스 단위 캡처 → dist/shots/cases/*.png + cases.json (대상은 capture-cases.json, 실패해도 배포는 계속)
      - name: Capture cases
        if: github.event_name == 'workflow_dispatch' && steps.pw.outcome == 'success'
        continue-on-error: true
        working-directory: scripts
        run: node shots-cases.mjs --dist ../dist --out ../dist/shots
      # 탭 화면 캡처 → dist/shots/views/*.png + views.json (대상은 scripts/view-tabs.json, 실패해도 배포는 계속)
      - name: Capture tab views
        if: github.event_name == 'workflow_dispatch' && steps.pw.outcome == 'success'
        continue-on-error: true
        working-directory: scripts
        run: node shots-views.mjs --dist ../dist --out ../dist/shots
      # 일반 푸시: 지금 공개된 사이트의 캡처 zip 을 받아 이번 배포에도 그대로 유지 (없으면 건너뜀)
      - name: Keep previous shots
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p dist/shots
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/shots/lions-app-shots.zip" -o /tmp/prev-shots.zip
          unzip -q -o /tmp/prev-shots.zip -d dist/shots
      # 모아보기(/shots/) + 전체 다운로드 zip (실패해도 배포는 계속)
      - name: Pack shots
        if: always() && hashFiles('dist/shots/index.json') != ''
        continue-on-error: true
        working-directory: scripts
        run: node shots-pack.mjs --out ../dist/shots --name lions-app --title "삼성 라이온즈 앱 화면 캡처"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
